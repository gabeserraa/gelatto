name: Backup do banco de dados

on:
  schedule:
    # 06:00 UTC = 03:00 em Brasília (horário de menor uso do sistema).
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar cliente do Postgres 17
        # O Supabase roda Postgres 17; pg_dump recusa fazer dump de um
        # servidor mais novo que ele mesmo, entao precisa do pacote
        # versionado do repositorio oficial do PostgreSQL (PGDG), nao o
        # postgresql-client generico do Ubuntu (que e a versao 16).
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17

      - name: Gerar dump do banco
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          pg_dump "$SUPABASE_DB_URL" --no-owner --no-privileges --format=custom \
            -f "gelatto-backup-$(date +%Y-%m-%d).dump"

      - name: Publicar como artifact
        uses: actions/upload-artifact@v4
        with:
          name: gelatto-backup-${{ github.run_id }}
          path: gelatto-backup-*.dump
          retention-days: 90
